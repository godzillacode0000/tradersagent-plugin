# Plugin-catalog entry — this file mirrors what was submitted, and records how we got there.
#
# SUBMITTED (14 Oct): https://github.com/NousResearch/hermes-agent/pull/139153 — one file,
# plugin-catalog/tradersagent-plugin.yaml, pinned to v1.3.0 (submitted from a fork branch; the
# submission itself lives in that PR, this copy is the repo's record of it).
#
#   repo public .......... yes
#   validation ........... PASSES: traders-desk/plugin.yaml + traders-desk/desktop/plugin.js, all
#                          checks green (`cd traders-desk && hermes plugins validate .`)
#   self-updating ........ none (rule 3 satisfied)
#   capabilities ......... EMPTY on purpose (rule 6): this package registers UI, not tools. The 56
#                          chart tools belong to the traders-chart MCP SERVER (bin/register-mcp.sh),
#                          listed at the bottom of this file for reference only.
#   subdir ............... traders-desk — the catalog derives the installed folder from the git
#                          identifier, so naming the package dir after the plugin makes a catalog
#                          install land at desktop-plugins/traders-desk/ = the plugin's id =
#                          install.sh's target (verified with a real install of the pinned sha in a
#                          scratch HERMES_HOME: it landed at plugins/traders-desk/).
#   disclosure ........... the pane frames a LOCAL console service (127.0.0.1:8787) this entry does
#                          not install: Binance bars + LuxAlgo's hosted MCP, long-running Python
#                          process, no account/key/telemetry. In the PR body and known_issues.
#
# To re-pin later (rule 4): a new PR that bumps sha+version together.
name: tradersagent-plugin
repo: https://github.com/godzillacode0000/tradersagent-plugin
sha: "5028dff8b24a7da5475ae0fcdd53558fcae81564"
subdir: traders-desk
version: "1.3.0"
description: >-
  A chart-first Trader's Agent for Hermes Desktop: one sidebar row docks a live Vela chart beside
  your conversation — replay, drawing tools, the LuxAlgo Library, a paper broker and Edge Stats
  behind it. Disclosure — the pane frames a local console service on 127.0.0.1:8787 that this
  package does not include or start: clone the repo and run ./console/start.sh (see known_issues).
  That console is a long-running Python process on your machine that fetches bars from Binance's
  public klines and Library scripts from LuxAlgo's hosted MCP over the network; it shells nothing,
  keeps no account, no key and no telemetry. The agent's 56 chart tools come from the repo's
  traders-chart MCP server, registered separately with ./bin/register-mcp.sh — the plugin itself
  registers UI only.
maintainer: godzillacode0000
tier: community
category: desktop
requires_hermes: ">=0.17.0"
# Linux (systemd-style helper) and macOS (launchd helper + venv notes: docs/MACOS.md). No Windows build.
platforms:
  - linux
  - macos
docs_url: https://github.com/godzillacode0000/tradersagent-plugin#readme
image: https://raw.githubusercontent.com/godzillacode0000/tradersagent-plugin/42a3a1d92fe029a92b96cd4467eb5b8228cce0cb/docs/screenshot.png
known_issues:
  - "The chart pane needs the repository's local console (127.0.0.1:8787), which this entry does not install. Clone https://github.com/godzillacode0000/tradersagent-plugin and run ./console/start.sh — the pane says exactly that when the console is unreachable."
  - "The agent's chart tools are not installed by this entry either: register the traders-chart MCP server with ./bin/register-mcp.sh (install.sh does both)."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []

# ── the MCP server's tools, for reference (NOT this plugin's capabilities) ──
# chart_views · chart_caps · chart_state · chart_shot · chart_apply_pine · chart_draw ·
# chart_pine_inputs · chart_clear · chart_add_indicator · chart_remove_indicator · chart_set_market ·
# chart_set_layout · chart_natives · chart_studies · chart_indicators · chart_reload · chart_replay ·
# chart_drawing · chart_view · chart_marks · chart_objects · chart_data_window · chart_palette ·
# chart_browse · broker_state · broker_propose · library_search · library_indicator · library_list ·
# library_taxonomy · library_concept · library_source · edge_presets · edge_report · edge_symbols ·
# edgestats_status · edgestats_fields · edgestats_presets · edgestats_query · edgestats_report ·
# edgestats_session · edgestats_show · edgestats_setup · propfirms · bt_run · bt_optimize ·
# bt_status · bt_data_list · propfirm_offers · chart_batch · chart_snapshot · chart_undo ·
# chart_watch · chart_alert · chart_fullscreen · chart_theme
