name: ci

on:
  push:
  pull_request:

jobs:
  plugin:
    name: plugin (harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Runs the plugin in plain Node against stubs of the three modules a plugin may import,
      # records what register() contributes, renders each contribution and checks it against
      # plugin/plugin.expect.json. Exits non-zero on a broken plugin.
      - run: node tools/verify-plugin.mjs plugin/plugin.js

  tests:
    name: tests (unit suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The suite is stdlib-only by design: the study store, the chat bridge, the chart bridge and
      # the push channel are all covered without a browser, a network, or the app — so this step
      # installs nothing at all.
      - name: unit suite (no dependencies)
        run: python -m unittest discover -s console/backend/tests -t console/backend/tests -v
      # The MCP wrapper is the one piece that needs a library (fastmcp). REQUIRE_MCP makes a missing
      # fastmcp a failure instead of a silent skip, so the layer can never go untested by accident.
      - name: MCP tool layer, against a stub console
        env:
          TRADER_CHART_REQUIRE_MCP: '1'
        run: |
          pip install fastmcp
          python -m unittest discover -s console/backend/tests -t console/backend/tests \
            -p 'test_mcp_server.py' -v

  backend:
    name: backend (compile + boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: the one non-stdlib dependency
        run: pip install 'mcp>=1,<2'
      - name: syntax
        run: python -m compileall -q console/backend console/mcp
      - name: boots and answers /api/health without an MCP session
        run: |
          cd console/backend
          python server.py --port 8899 --frontend ../frontend --no-mcp &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8899/api/health > /tmp/health.json; then break; fi
            sleep 0.5
          done
          cat /tmp/health.json
          kill %1
